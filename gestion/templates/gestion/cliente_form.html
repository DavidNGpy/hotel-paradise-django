{% extends 'gestion/base.html' %}
{% block title %}{{ titulo }} - Hotel Paradise{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-3">{{ titulo }}</h4>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'lista_clientes' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-dark px-4">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
