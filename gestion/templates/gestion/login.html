{% extends 'gestion/base.html' %}
{% block title %}Iniciar Sesión - Hotel Paradise{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-building-fill-check text-warning" style="font-size: 3rem;"></i>
                <h3 class="fw-bold mt-2">Hotel Paradise</h3>
                <p class="text-muted small">Acceso exclusivo para personal del hotel</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
