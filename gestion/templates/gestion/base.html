<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hotel Paradise - Resort & Spa{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paradise-navy: #0b2538;
            --paradise-ocean: #133b56;
            --paradise-teal: #0d9488;
            --paradise-gold: #d4af37;
            --paradise-gold-hover: #b89327;
            --paradise-sand: #f8f6f0;
        }

        body {
            background-color: var(--paradise-sand);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }

        h1, h2, h3, h4, .navbar-brand {
            font-family: 'Playfair Display', serif;
        }

        /* Navbar Lujoso */
        .navbar-paradise {
            background: linear-gradient(135deg, var(--paradise-navy) 0%, var(--paradise-ocean) 100%);
            border-bottom: 3px solid var(--paradise-gold);
        }

        .navbar-brand {
            color: var(--paradise-gold) !important;
            font-weight: 700;
            font-size: 1.45rem;
            letter-spacing: 0.8px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
            font-weight: 500;
            transition: all 0.2s ease;
            border-radius: 8px;
            padding: 0.5rem 0.85rem !important;
        }

        .nav-link:hover {
            color: var(--paradise-gold) !important;
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* Tarjetas Elevadas */
        .card {
            border: 1px solid rgba(212, 175, 55, 0.18);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(11, 37, 56, 0.06);
            background-color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Botones Personalizados */
        .btn-dark {
            background: linear-gradient(135deg, var(--paradise-navy) 0%, var(--paradise-ocean) 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-dark:hover {
            background: linear-gradient(135deg, #071926 0%, var(--paradise-navy) 100%);
            color: var(--paradise-gold);
        }

        .btn-warning {
            background: linear-gradient(135deg, #e2c044 0%, var(--paradise-gold) 100%);
            border: none;
            color: var(--paradise-navy) !important;
            font-weight: 700;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-warning:hover {
            background: var(--paradise-gold-hover);
            color: #ffffff !important;
        }

        .btn-outline-dark {
            border-color: var(--paradise-ocean);
            color: var(--paradise-ocean);
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-outline-dark:hover {
            background-color: var(--paradise-ocean);
            color: #ffffff;
        }

        /* Tablas Elegantes */
        .table thead th {
            background-color: #f1ede4;
            color: var(--paradise-navy);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.6px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
        }

        /* Acentos Paradisíacos */
        .text-primary { color: var(--paradise-ocean) !important; }
        .text-success { color: var(--paradise-teal) !important; }
        .bg-success { background-color: var(--paradise-teal) !important; }
        .border-warning { border-color: var(--paradise-gold) !important; }
        .border-success { border-color: var(--paradise-teal) !important; }
        .border-primary { border-color: var(--paradise-ocean) !important; }

        /* Inputs más refinados */
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 0.55rem 0.9rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--paradise-gold);
            box-shadow: 0 0 0 0.2rem rgba(212, 175, 55, 0.22);
        }
    </style>
</head>
<body>

{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark navbar-paradise shadow mb-4 py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'dashboard' %}">
            <i class="bi bi-gem me-2"></i>Hotel Paradise
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto ms-lg-3 gap-1">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'consultar_disponibilidad' %}"><i class="bi bi-calendar2-check me-1"></i>Disponibilidad</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'lista_reservaciones' %}"><i class="bi bi-journal-bookmark-fill me-1"></i>Reservaciones</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'lista_habitaciones' %}"><i class="bi bi-door-open-fill me-1"></i>Habitaciones</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'lista_clientes' %}"><i class="bi bi-people-fill me-1"></i>Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'reportes' %}"><i class="bi bi-bar-chart-line-fill me-1"></i>Reportes</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-light">
                <span class="me-3 small px-3 py-1 rounded-pill" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(212,175,55,0.4);">
                    <i class="bi bi-person-badge me-1 text-warning"></i>{{ user.username }}
                </span>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light rounded-pill px-3">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </a>
            </div>
        </div>
    </div>
</nav>
{% endif %}

<div class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show shadow-sm rounded-3" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
