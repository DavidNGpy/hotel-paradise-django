{% extends 'gestion/base.html' %}
{% block title %}Confirmar Acción - Hotel Paradise{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4 text-center border-top border-danger border-4">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
            <h4 class="fw-bold mt-2">{{ accion|default:"Confirmar Eliminación" }}</h4>
            <p class="text-muted">¿Estás seguro de que deseas continuar con esta acción sobre:</p>
            <p class="fw-bold fs-5 text-dark">{{ objeto }}</p>
            <form method="post" class="d-flex justify-content-center gap-3 mt-3">
                {% csrf_token %}
                <a href="{% url cancel_url %}" class="btn btn-outline-secondary px-4">Volver</a>
                <button type="submit" class="btn btn-danger px-4">Sí, confirmar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
